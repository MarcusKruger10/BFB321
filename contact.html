<body><main class="dashboard-shell contact-shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">N</span><span class="brand-copy"><strong>Northstar</strong><small>Product operations</small></span></a><nav class="nav" aria-label="Primary navigation"><a href="index.html">Overview</a><a href="index.html#products">Products</a><a class="active" href="contact.html">Contact</a></nav></header><section class="contact-intro"><p class="eyebrow">Northstar support</p><h1>Let’s keep your operation moving.</h1><p class="lede">Have a question about your reports, planning data, or account? Send us a note and our team will get back to you.</p></section><form class="contact-form" method="POST"><div class="form-row"><label for="name">Name<input type="text" id="name" name="name" placeholder="Your name" required></label><label for="email">Email<input type="email" id="email" name="email" placeholder="you@company.com" required></label></div><label for="message">How can we help?<textarea id="message" name="message" rows="6" placeholder="Tell us what you need..."></textarea></label><button class="primary-btn" type="submit">Send message <span>&#8594;</span></button></form></main></body>
